[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claim-mcp-http-public"
version = "0.1.0"
description = "Deterministic Streamable HTTP MCP server for LightNow ownership claim acceptance tests"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
]

[project.scripts]
claim-mcp-http-public = "claim_mcp_http_public.server:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/claim_mcp_http_public"]

